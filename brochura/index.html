<section id="sem-js-manifesto">
<p>Há marcas que passam despercebidas.</p>
<p>E há marcas que se veem do outro lado da rua.</p>
<p>A diferença raramente é o orçamento. É saber o que fazer com ele.</p>
<p>Há mais de dez anos que damos forma, cor e luz a marcas do Grande Porto e de todo o país. Não desenhamos e entregamos: projetamos, fabricamos e instalamos. Do primeiro esboço ao parafuso final.</p>
</section>
<section id="sem-js-quem-somos">
<p class="sem-js__kicker">Quem somos</p>
<h2>Somos a Yes, We Do.</h2>
<p>A Yes Wedo, Lda. nasceu das mãos de dois sócios com mais de dez anos de experiência no setor. Juntaram o que sabiam — produção, montagem, design — e abriram portas em Rio Tinto com uma ideia simples: fazer tudo em casa, do princípio ao fim.</p>
<p>É isso que nos distingue. Não subcontratamos o essencial. O projeto é nosso, o fabrico é nosso, a instalação é nossa. Quando algo corre mal, não há a quem apontar o dedo — resolvemos.</p>
<p>De Rio Tinto para todo o país, dizemos sim aos desafios. Acreditamos que cada marca tem uma história única para contar, e sabemos como a materializar da forma mais impactante.</p>
</section>
<section id="sem-js-numeros">
<p class="sem-js__kicker">Em números</p>
<h2>Dez anos a pôr marcas de pé.</h2>
<p>Trabalhamos para hospitais, marcas internacionais de moda, concessionários, centros comerciais, clínicas e restaurantes. Projetos de uma placa e projetos de um hospital inteiro.</p>
<p>A escala muda. O cuidado não.</p>
<p>Cobrimos o Grande Porto, Matosinhos, Maia, Gondomar, Valongo e todo o norte de Portugal. Para projetos maiores, deslocamo-nos a qualquer ponto do país.</p>
</section>
<section id="sem-js-mapa-servicos">
<p class="sem-js__kicker">O que fazemos</p>
<h2>Doze formas de dar a ver a sua marca.</h2>
<p>Da placa de porta ao reclame de fachada. Do vinil de uma montra ao stand de uma feira internacional.</p>
<ul><li><strong>Reclames Luminosos</strong> — Letreiros com iluminação LED para máxima visibilidade, dia e noite.</li><li><strong>Sinaléticas</strong> — Sinalética interior e exterior, lettering e placas de identificação.</li><li><strong>Impressão Grandes Formatos</strong> — Impressão digital para vitrinas, fachadas, veículos e qualquer superfície.</li><li><strong>Decoração de Espaços</strong> — Ambientação de espaços comerciais, escritórios e pontos de venda.</li><li><strong>Néons</strong> — Letreiros e decorações em néon LED personalizados.</li><li><strong>Eventos</strong> — Produção de materiais para feiras, exposições e lançamentos de marca.</li><li><strong>Decoração de Montras</strong> — Montras que atraem clientes e comunicam promoções com eficácia.</li><li><strong>Lonas &amp; Stands</strong> — Lonas publicitárias e stands para eventos, feiras e pontos de venda.</li><li><strong>Flyers &amp; Brochuras</strong> — Design e impressão de flyers, brochuras e catálogos.</li><li><strong>Merchandising</strong> — Artigos promocionais personalizados e merchandising corporativo.</li><li><strong>Páginas Web</strong> — Websites modernos e responsivos que elevam a presença digital.</li><li><strong>Decoração de Viaturas</strong> — Vinil que transforma cada veículo numa ferramenta de marketing.</li></ul>

<section id="sem-js-reclames">
<p class="sem-js__kicker">01 · Serviços</p>
<h2>Reclames Luminosos</h2>
<p><strong>A sua marca vista de longe, dia e noite.</strong></p>
<p>Um reclame luminoso é o primeiro funcionário da sua empresa: trabalha 24 horas por dia, todos os dias, e nunca falta. Fabricamos letras monobloco em alumínio com iluminação LED, retroiluminadas ou frontais, dimensionadas para a distância a que vão ser lidas.</p>
<p>Tratamos do projeto, do fabrico e da instalação — incluindo o trabalho em altura com plataforma quando é preciso. Entregamos o reclame aceso e a funcionar, não uma caixa por montar.</p>
<ul><li>Letras monobloco em alumínio</li><li>Iluminação LED de baixo consumo</li><li>Retroiluminado ou frontal</li><li>Instalação em altura incluída</li></ul>
<p><strong>Reclames luminosos? Yes, we do.</strong></p>
</section>
<section id="sem-js-letras-recortadas">
<p class="sem-js__kicker">02 · Serviços</p>
<h2>Letras Recortadas</h2>
<p><strong>Volume, sombra e presença. Sem eletricidade.</strong></p>
<p>Nem tudo precisa de luz para se impor. Letras recortadas em relevo dão profundidade a uma receção, a uma fachada ou a uma parede de escritório — e a sombra que projetam faz metade do trabalho.</p>
<p>Cortamos em acrílico, PVC, alumínio composto ou inox escovado, com o acabamento à medida do espaço. Aplicação com espaçadores ou colagem direta, sempre alinhada a laser.</p>
<ul><li>Acrílico, PVC, alumínio ou inox</li><li>Espessuras de 3 a 30 mm</li><li>Aplicação com espaçadores ou direta</li><li>Alinhamento a laser na instalação</li></ul>
<p><strong>Letras recortadas? Yes, we do.</strong></p>
</section>
<section id="sem-js-sinaleticas">
<p class="sem-js__kicker">03 · Serviços</p>
<h2>Sinaléticas</h2>
<p><strong>Quem entra tem de saber para onde ir.</strong></p>
<p>Sinalética é o serviço mais invisível que fazemos — e nota-se logo quando falta. Num hospital, num centro comercial ou num edifício de escritórios, um sistema de sinalética bem pensado é a diferença entre um visitante orientado e um visitante perdido.</p>
<p>Desenhamos o sistema completo: direcional, identificativa, de segurança e de porta. Numeração coerente, tipografia legível à distância certa, materiais que aguentam anos de utilização intensa.</p>
<ul><li>Sistemas completos, não peças soltas</li><li>Direcional, identificativa e de segurança</li><li>Materiais para uso intensivo</li><li>Ampliável à medida que o espaço cresce</li></ul>
<p><strong>Sinalética? Yes, we do.</strong></p>
</section>
<section id="sem-js-lonas">
<p class="sem-js__kicker">04 · Serviços</p>
<h2>Lonas &amp; Impressão em Grandes Formatos</h2>
<p><strong>Quando é preciso ocupar uma fachada inteira.</strong></p>
<p>Uma obra em curso, um hospital em expansão, uma campanha que precisa de ser vista do outro lado da avenida. A impressão em grande formato resolve em dias o que uma estrutura permanente demoraria meses.</p>
<p>Imprimimos em lona, vinil, rede microperfurada e telas de fachada, com tintas resistentes a UV. E instalamos — incluindo os trabalhos em altura que a maioria das gráficas não faz.</p>
<ul><li>Lona, vinil, rede microperfurada e tela</li><li>Tintas resistentes a UV e intempérie</li><li>Sem limite prático de dimensão</li><li>Instalação em altura incluída</li></ul>
<p><strong>Grandes formatos? Yes, we do.</strong></p>
</section>
<section id="sem-js-stands">
<p class="sem-js__kicker">05 · Serviços</p>
<h2>Stands &amp; Eventos</h2>
<p><strong>Três dias para causar impressão. Sem segunda hipótese.</strong></p>
<p>Numa feira, o seu stand compete com dezenas de outros pelo olhar de quem passa. Produzimos stands, backdrops, press walls, photobooths, balcões e bandeiras — e montamos tudo no local, a horas, com a marca alinhada ao milímetro.</p>
<p>É a área onde temos mais quilómetros: Vogue Fashion Night, Liu Jo, Steve Madden, SPMEC, Abreu. Eventos de moda, congressos médicos e ativações de marca em que o prazo não se negoceia.</p>
<ul><li>Stands, backdrops e press walls</li><li>Photobooths e balcões de receção</li><li>Montagem e desmontagem no local</li><li>Cumprimento de prazos de feira</li></ul>
<p><strong>Stands e eventos? Yes, we do.</strong></p>
</section>

<h2>Decoração de Viaturas</h2>
<p><strong>Publicidade que anda sozinha pela cidade.</strong></p>
<p>Uma carrinha decorada passa por milhares de pessoas por dia e não custa nada a mais depois de aplicada. É o meio publicitário com melhor retorno por euro investido — e o único que trabalha enquanto a equipa vai para o cliente.</p>
<p>Aplicamos vinil de fundição em decoração total ou parcial, com desenho adaptado à forma do veículo. Vinil de qualidade automóvel, removível sem danificar a pintura.</p>
<ul><li>Decoração total ou parcial</li><li>Vinil de fundição, qualidade automóvel</li><li>Removível sem danificar a pintura</li><li>Frotas com aplicação uniforme</li></ul>
<p><strong>Decoração de viaturas? Yes, we do.</strong></p>
</section>

<p><strong>O vidro é o cartaz mais barato que tem.</strong></p>
<p>A montra é o único espaço publicitário que já pagou: está pago na renda. Vinil recortado, impresso ou jateado transforma um vidro comum na primeira frase que o cliente lê sobre o seu negócio.</p>
<p>Fazemos desde a campanha sazonal que se troca em duas horas até à identidade permanente da loja. E o vinil jateado resolve, de caminho, o problema da privacidade em clínicas e escritórios.</p>
<ul><li>Vinil recortado, impresso ou jateado</li><li>Campanhas sazonais ou permanentes</li><li>Efeito jateado para privacidade</li><li>Aplicação sem bolhas, garantida</li></ul>
<p><strong>Decoração de montras? Yes, we do.</strong></p>

<ol><li><strong>Conversa</strong> — Vamos ao local, medimos e percebemos o que precisa. Sem custo e sem compromisso.</li><li><strong>Projeto</strong> — Recebe a simulação do trabalho aplicado ao seu espaço, com orçamento fechado. Sem surpresas no fim.</li><li><strong>Produção</strong> — Fabricamos nas nossas instalações em Rio Tinto. Controlamos o prazo porque a oficina é nossa.</li><li><strong>Instalação</strong> — Montamos no local, incluindo trabalhos em altura. Deixamos a funcionar e o espaço limpo.</li><li><strong>Acompanhamento</strong> — Continuamos disponíveis. Uma lâmpada, um vinil descolado, uma ampliação — atende sempre a mesma pessoa.</li></ol>
